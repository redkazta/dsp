<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" style="background: transparent;">
  <defs>
    <filter id="drip" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ffe28a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo oscuro -->
  <rect width="400" height="400" fill="#0a0a0a"/>
  
  <!-- Billetes de dinero alrededor -->
  <g fill="#ffe28a" opacity="0.9">
    <rect x="120" y="30" width="40" height="20" rx="2"/>
    <rect x="240" y="30" width="40" height="20" rx="2"/>
    <rect x="120" y="350" width="40" height="20" rx="2"/>
    <rect x="240" y="350" width="40" height="20" rx="2"/>
    <rect x="30" y="120" width="20" height="40" rx="2"/>
    <rect x="350" y="120" width="20" height="40" rx="2"/>
    <rect x="30" y="240" width="20" height="40" rx="2"/>
    <rect x="350" y="240" width="20" height="40" rx="2"/>
  </g>
  
  <!-- Texto D$P! con estilo dripping -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="url(#grad)" text-anchor="middle" dominant-baseline="middle" filter="url(#drip)">
    D$P!
  </text>
  
  <!-- Brillo central -->
  <circle cx="200" cy="210" r="30" fill="#ffffff" opacity="0.6"/>
</svg>