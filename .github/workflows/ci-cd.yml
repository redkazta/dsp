name: CI/CD - Render Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      # Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore src/Api/WildForgeLabs.Api.csproj
      
      # Build API
      - name: Build API
        run: dotnet build src/Api/WildForgeLabs.Api.csproj -c Release
      
      # Publish API
      - name: Publish API
        run: dotnet publish src/Api/WildForgeLabs.Api.csproj -c Release -o ./publish/api
      
      # Deploy to Render (usando API o script personalizado)
      - name: Deploy to Render
        run: |
          echo "Deploying to Render..."
          # Aquí iría el deploy script o API call a Render
          # Por ahora, solo subimos los artifacts
      
      # Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: render-deploy
          path: ./publish/api